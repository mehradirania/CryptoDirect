<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CryptoDirect – Crypto Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      max-width: 1200px;
      margin: 0 auto 40px;
      text-align: center;
      color: white;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .wallet-status {
      max-width: 1200px;
      margin: 0 auto 20px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.3);
      padding: 12px 20px;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .wallet-info {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .wallet-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
    }

    .wallet-dot.disconnected {
      background: #ef4444;
    }

    .connect-wallet-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .products-container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
      transition: .3s;
      cursor: pointer;
    }

    .product-card:hover {
      transform: translateY(-8px);
    }

    .product-image {
      width: 100%;
      height: 200px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 48px;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-body {
      padding: 20px;
    }

    .product-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #222;
    }

    .product-desc {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .product-price {
      font-size: 18px;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 12px;
    }

    .product-btn,
    .pay-button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .loading,
    .no-products {
      text-align: center;
      color: white;
      padding: 40px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      padding: 24px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #999;
    }

    .modal-body {
      padding: 24px;
    }

    .product-detail-image {
      width: 100%;
      height: 250px;
      background: #f5f5f5;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .product-detail-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-detail-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .product-detail-desc {
      color: #666;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .product-detail-price {
      font-size: 22px;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 20px;
    }

    .payment-info {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #666;
    }

    .payment-info strong {
      color: #222;
    }

    .payment-info code {
      display: block;
      margin: 8px 0;
      padding: 4px;
      background: #eee;
      word-break: break-all;
    }

    .status-message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
    }

    .status-message.pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-message.success {
      background: #dcfce7;
      color: #166534;
    }

    .status-message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .download-box {
      margin-top: 16px;
      padding: 16px;
      background: #f0f9ff;
      border: 2px solid #0284c7;
      border-radius: 8px;
      text-align: center;
    }

    .download-box a {
      color: #0284c7;
      text-decoration: none;
      font-weight: 600;
    }

    .warning-message {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      padding: 16px;
      border-radius: 8px;
      margin: 20px auto;
      max-width: 1200px;
      color: #92400e;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🪙 CryptoDirect</h1>
    <p>Crypto Payment Store - Pay with USDT TRC20</p>
  </div>

  <div class="wallet-status">
    <div class="wallet-info">
      <span class="wallet-dot disconnected" id="walletDot"></span>
      <span id="walletText">Wallet not connected</span>
    </div>

    <button class="connect-wallet-btn" id="connectWalletBtn">
      Connect Wallet
    </button>
  </div>

  <div id="warningContainer"></div>

  <div class="products-container" id="productsContainer">
    <div class="loading">Loading products...</div>
  </div>

  <div class="modal" id="paymentModal">

    <div class="modal-content">

      <div class="modal-header">
        <div class="modal-title">Product Details</div>
        <button class="modal-close" id="closeModal">&times;</button>
      </div>

      <div class="modal-body" id="modalBody"></div>

    </div>

  </div>
  
<script src="config.js"></script>

<script type="module">
  import bufferPolyfill from "https://cdn.jsdelivr.net/npm/buffer-polyfill@6.0.3/+esm";
  window.Buffer = bufferPolyfill;
</script>

<script src="https://cdn.jsdelivr.net/npm/@walletconnect/sign-client/dist/index.umd.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@tronweb3/tronwallet-adapters@1.3.3/lib/umd/index.js"></script>

<script src="https://cdn.jsdelivr.net/npm/tronweb@6.0.5/dist/TronWeb.js"></script>

<script src="scripts/payment.js"></script>
<script src="scripts/app.js"></script>

</body>
</html>
