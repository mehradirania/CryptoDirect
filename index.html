<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>CryptoDirect – فروشگاه کریپتو</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      direction: rtl;
    }

    .header {
      max-width: 1200px;
      margin: 0 auto 40px;
      text-align: center;
      color: white;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .wallet-status {
      max-width: 1200px;
      margin: 0 auto 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 12px 20px;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .wallet-info {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .wallet-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
    }

    .wallet-dot.disconnected {
      background: #ef4444;
    }

    .connect-wallet-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .connect-wallet-btn:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    .connect-wallet-btn:disabled {
      background: #999;
      cursor: default;
    }

    .products-container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: all 0.3s;
      cursor: pointer;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .product-image {
      width: 100%;
      height: 200px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-body {
      padding: 20px;
      text-align: right;
    }

    .product-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #222;
    }

    .product-desc {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-price {
      font-size: 18px;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 12px;
    }

    .product-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .product-btn:hover {
      transform: scale(1.02);
      opacity: 0.9;
    }

    .loading {
      text-align: center;
      color: white;
      font-size: 16px;
      padding: 40px;
    }

    .no-products {
      text-align: center;
      color: white;
      font-size: 18px;
      padding: 60px 20px;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .modal-header {
      padding: 24px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #222;
      text-align: right;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #999;
    }

    .modal-body {
      padding: 24px;
      text-align: right;
    }

    .product-detail-image {
      width: 100%;
      height: 250px;
      background: #f5f5f5;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .product-detail-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-detail-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #222;
    }

    .product-detail-desc {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .product-detail-price {
      font-size: 22px;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 20px;
    }

    .payment-info {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #666;
    }

    .payment-info strong {
      color: #222;
    }

    .pay-button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .pay-button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .pay-button:disabled {
      background: #ccc;
      cursor: default;
    }

    .status-message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      font-weight: 600;
    }

    .status-message.pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-message.success {
      background: #dcfce7;
      color: #166534;
    }

    .status-message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .download-box {
      margin-top: 16px;
      padding: 16px;
      background: #f0f9ff;
      border: 2px solid #0284c7;
      border-radius: 8px;
      text-align: center;
    }

    .download-box a {
      color: #0284c7;
      text-decoration: none;
      font-weight: 600;
      word-break: break-all;
    }

    .download-box a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🪙 CryptoDirect</h1>
    <p>فروشگاه پرداخت کریپتو - پرداخت با USDT TRC20</p>
  </div>

  <div class="wallet-status" id="walletStatus">
    <div class="wallet-info">
      <span class="wallet-dot disconnected" id="walletDot"></span>
      <span id="walletText">کیف پول متصل نیست</span>
    </div>
    <button class="connect-wallet-btn" id="connectWalletBtn">اتصال کیف پول</button>
  </div>

  <div class="products-container" id="productsContainer">
    <div class="loading">در حال بارگذاری محصولات...</div>
  </div>

  <!-- Payment Modal -->
  <div class="modal" id="paymentModal">
    <div class="modal-content">
      <div class="modal-header">
        <button class="modal-close" id="closeModal">&times;</button>
        <div class="modal-title" id="modalTitle">جزئیات محصول</div>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="scripts/payment.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
