<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CryptoDirect Store</title>

  <link rel="stylesheet" href="style.css">

  <!-- WalletConnect v2 -->
  <script src="https://unpkg.com/@walletconnect/modal@2.6.2/dist/index.umd.js"></script>
  <script src="https://unpkg.com/@walletconnect/ethereum-provider@2.6.2/dist/index.umd.js"></script>

  <!-- Web3.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.10.0/web3.min.js"></script>

  <!-- TronLink Adapters -->
  <script src="https://cdn.jsdelivr.net/npm/@tronweb3/tronwallet-adapters@1.3.3/lib/umd/index.js"></script>

  <!-- TronWeb -->
  <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.0/dist/TronWeb.js"></script>

  <!-- CONFIGS -->
  <script src="config.js"></script>
  <script src="config_bep20.js"></script>

  <!-- PAYMENT MODULES -->
  <script src="CryptoPayment.js"></script>
  <script src="CryptoPayment_BEP20.js"></script>

  <!-- APP -->
  <script src="app.js"></script>

</head>
<body>

  <header>
    <h1>CryptoDirect Store</h1>

    <button id="connectWalletBtn">
      <span id="walletDot" class="disconnected"></span>
      <span id="walletText">Wallet not connected</span>
    </button>
  </header>

  <div id="warningContainer"></div>

  <main>
    <div id="productsContainer" class="products-grid"></div>
  </main>

  <!-- Payment Modal -->
  <div id="paymentModal" class="modal">
    <div class="modal-content">
      <button id="closeModal" class="close-btn">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

</body>
</html>
