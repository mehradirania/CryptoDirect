<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CryptoDirect Store</title>

  <link rel="stylesheet" href="style.css">

  <!-- CONFIG -->
  <script src="config.js"></script>

  <!-- Buffer Polyfill -->
  <script type="module">
    import bufferPolyfill from "https://cdn.jsdelivr.net/npm/buffer-polyfill@6.0.3/+esm";
    window.Buffer = bufferPolyfill;
  </script>

  <!-- WalletConnect -->
  <script src="https://cdn.jsdelivr.net/npm/@walletconnect/sign-client/dist/index.umd.js"></script>

  <!-- TRON Wallet Adapters -->
  <script src="https://cdn.jsdelivr.net/npm/@tronweb3/tronwallet-adapters@1.3.3/lib/umd/index.js"></script>

  <!-- TronWeb -->
  <script src="https://cdn.jsdelivr.net/npm/tronweb@6.0.5/dist/TronWeb.js"></script>

  <!-- PAYMENT -->
  <script src="scripts/payment.js"></script>

  <!-- APP -->
  <script src="scripts/app.js"></script>
</head>

<body>

  <header>
    <h1>CryptoDirect Store</h1>

    <button id="connectWalletBtn">
      <span id="walletDot" class="disconnected"></span>
      <span id="walletText">Wallet not connected</span>
    </button>
  </header>

  <div id="warningContainer"></div>

  <main>
    <div id="productsContainer" class="products-grid"></div>
  </main>

  <!-- Payment Modal -->
  <div id="paymentModal" class="modal">
    <div class="modal-content">
      <button id="closeModal" class="close-btn">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

</body>
</html>
