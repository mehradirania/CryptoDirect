<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>CryptoDirect – پرداخت محصول</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #d9e8ff;
    }
    .card {
      max-width: 480px;
      margin: 40px auto;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 22px;
    }
    .image-wrapper {
      width: 260px;
      height: 260px;
      margin: 16px auto;
      border: 4px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #f5f5f5;
    }
    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .desc {
      margin: 12px 0;
      font-size: 14px;
      line-height: 1.6;
      text-align: right;
    }
    .price {
      margin: 8px 0 16px;
      font-weight: 700;
      font-size: 16px;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: #1a4fb8;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:disabled {
      background: #999;
      cursor: default;
    }
    .download {
      margin-top: 16px;
      font-size: 14px;
      direction: ltr;
      word-break: break-all;
    }
    .message {
      font-size: 20px;
      font-weight: 700;
      margin: 40px 0;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div id="content"></div>
  </div>

  <script>
    async function loadProduct() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      const content = document.getElementById('content');

      if (!id) {
        content.innerHTML = '<div class="message">فروش تمام شد</div>';
        return;
      }

      try {
        const res = await fetch('products.json');
        const data = await res.json();
        const product = data[id];

        if (!product) {
          content.innerHTML = '<div class="message">فروش تمام شد</div>';
          return;
        }

        content.innerHTML = `
          <h1>${product.name}</h1>
          <div class="image-wrapper">
            ${product.image
              ? `<img src="${product.image}" alt="${product.name}">`
              : '<span>تصویر محصول</span>'}
          </div>
          <div class="desc">${product.description || ''}</div>
          <div class="price">${product.price} دلار (USDT TRC20)</div>
          <button class="btn" id="payBtn">پرداخت USDT TRC20</button>
          <div class="download" id="downloadBox"></div>
        `;

        const payBtn = document.getElementById('payBtn');
        const downloadBox = document.getElementById('downloadBox');

        payBtn.addEventListener('click', () => {
          // اینجا بعداً می‌تونی لاجیک واقعی پرداخت رو وصل کنی
          payBtn.disabled = true;
          payBtn.textContent = 'پرداخت در حال پردازش...';

          setTimeout(() => {
            payBtn.textContent = 'پرداخت تأیید شد';
            downloadBox.innerHTML =
              `لینک دانلود: <a href="${product.file}" target="_blank">${product.file}</a>`;
          }, 1500);
        });
      } catch (e) {
        content.innerHTML = '<div class="message">خطا در بارگذاری محصول</div>';
      }
    }

    loadProduct();
  </script>
</body>
</html>
